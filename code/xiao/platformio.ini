[platformio]
default_envs = xiao_nrf52840_sense

[env:xiao_nrf52840_sense]
; Configuracion recomendada por Seeed para XIAO nRF52840 / Sense.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
; Sense selecciona Wire1 para la IMU integrada (la variante normal usa Wire).
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
upload_protocol = nrfutil
monitor_speed = 115200
lib_deps = seeed-studio/Seeed Arduino LSM6DS3


; Descomenta si necesitas seleccionar el puerto manualmente.
; upload_port = COM5
; monitor_port = COM5
